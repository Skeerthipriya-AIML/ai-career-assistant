services:
  - type: web
    name: ai-career-assistant-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CHROMA_DB_PATH
        value: ./chroma_db
      - key: MONGODB_URI
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
